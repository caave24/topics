
name: Format Markdown Lists

on:
  push:
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format Markdown
        run: python3 .github/scripts/format_markdown.py

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No Markdown formatting changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "**/*.md"
          git commit -m "Format Markdown lists"
          git push
